<!DOCTYPE html>

<head>

<meta property="og:title" content="Md. Sakib Hossain | Full Stack Developer">

<meta property="og:image" content="sakib-hossain.jpg">

<body>
<div class="progress" id="progress"></div>

<header class="nav" id="nav">
  <a href="#home" class="logo" id="logo">MSH.</a>
  <nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact" class="pill">Let's talk</a>
  </nav>
</header>

<main>
  <section id="home" class="hero">
    <div class="hero-text">
      <p class="status" id="status"><span class="dot"></span><span id="statusText"></span></p>
      <h1 id="heroTitle" aria-label=""></h1>
      <p class="typed-line"><span id="typed"></span><span class="caret"></span></p>
      <p class="hero-sub" id="heroSub"></p>
      <a href="#projects" class="btn">View my work</a>
    </div>
    <figure class="hero-photo">
      <img id="photo" alt="Portrait">
      <figcaption id="location"></figcaption>
    </figure>
  </section>

  <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

  <section id="about" class="section about">
    <h2 id="aboutTitle"></h2>
    <div>
      <p id="aboutText"></p>
      <div class="edu"><strong id="eduDegree"></strong><span id="eduNote"></span></div>
    </div>
  </section>

  <section id="skills" class="section">
    <h2 class="sec-title">What I bring to the table</h2>
    <div class="skill-grid" id="skillGrid"></div>
    <div class="soft" id="soft"></div>
  </section>

  <section id="projects" class="section">
    <h2 class="sec-title">Live projects, built end to end</h2>
    <div class="project-grid" id="projectGrid"></div>
  </section>

  <section id="contact" class="section contact">
    <h2>Have an idea? Let's build it.</h2>
    <a class="mail" id="mail" href="#"></a>
