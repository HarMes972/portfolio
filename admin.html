<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio Admin</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f1b2d;--muted:#667085;--line:#dbe1ec;--accent:#2f5bff;--danger:#d92d20;--ok:#12b76a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;margin-right:auto}
main{max-width:860px;margin:0 auto;padding:20px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
nav.tabs button{background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.box h3{margin:0 0 12px;font-size:1rem}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 4px;color:var(--muted)}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
button.b,label.b{display:inline-block;background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:700;cursor:pointer}
button.b.alt,label.b.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.b.red{background:var(--danger)}
button.b:disabled{opacity:.5;cursor:wait}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumbs{width:120px;height:75px;border-radius:8px;object-fit:cover;background:#e4e8f1;margin-top:8px;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;z-index:99}
.toast.show{opacity:1}.toast.err{background:var(--danger)}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.dirty{color:#b54708;font-weight:700;font-size:.85rem}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Portfolio Admin</h1>
  <span class="dirty hide" id="dirty">● Unsaved changes</span>
  <a href="index.html" target="_blank" class="b alt" style="text-decoration:none;padding:9px 14px;border:1px solid var(--line);border-radius:9px;color:inherit;font-weight:700">View site</a>
  <button class="b" id="publish">Publish to GitHub</button>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>

  <section class="panel" id="p-profile"></section>
  <section class="panel" id="p-skills"></section>
  <section class="panel" id="p-projects"></section>
  <section class="panel" id="p-contact"></section>

  <section class="panel" id="p-settings">
    <div class="box">
      <h3>GitHub connection</h3>
      <div class="row">
        <div><label>Owner</label><input id="g-owner"></div>
        <div><label>Repository</label><input id="g-repo"></div>
      </div>
      <div class="row">
        <div><label>Branch</label><input id="g-branch"></div>
        <div><label>Personal access token</label><input id="g-token" type="password" placeholder="github_pat_..." autocomplete="off"></div>
      </div>
      <p class="hint">Token ta shudhu tomar browser e (localStorage) thake, kothao pathano hoy na, shudhu GitHub API te jay. Token chara keu publish korte parbe na. Fine-grained token banao: shudhu ei repo, permission: <b>Contents → Read and write</b>.</p>
      <div class="tools">
        <button class="b" id="saveSettings">Save settings</button>
        <button class="b alt" id="reload">Reload from GitHub</button>
        <button class="b alt" id="forget">Remove token</button>
      </div>
    </div>
    <div class="box">
      <h3>Backup</h3>
      <div class="tools">
        <button class="b alt" id="download">Download data.json</button>
        <label class="b alt" style="margin:0;cursor:pointer">Import data.json<input type="file" id="import" accept=".json" class="hide"></label>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let data = null, dirty = false;
const previews = {};
const cfgDefault = { owner: 'HarMes972', repo: 'portfolio', branch: 'main', token: '' };
const cfg = () => ({ ...cfgDefault, ...JSON.parse(localStorage.getItem('pf-cfg') || '{}') });

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
function mark() { dirty = true; $('#dirty').classList.remove('hide'); }
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));

/* ---------- GitHub ---------- */
async function gh(path, opts = {}) {
  const c = cfg();
  if (!c.token) throw new Error('Settings e GitHub token dao.');
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}` + (opts.method ? '' : `?ref=${c.branch}`), {
    ...opts, headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', ...(opts.headers || {}) }
  });
  if (r.status === 404 && !opts.method) return null;
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status);
  return r.json();
}
async function putFile(path, contentB64, msg) {
  const c = cfg(); const ex = await gh(path);
  return gh(path, { method: 'PUT', body: JSON.stringify({ message: msg, content: contentB64, branch: c.branch, ...(ex ? { sha: ex.sha } : {}) }) });
}

async function loadData() {
  try {
    if (cfg().token) {
      const f = await gh('data.json');
      if (f) { data = JSON.parse(b64dec(f.content)); return; }
    }
    const r = await fetch('data.json?v=' + Date.now()); data = await r.json();
  } catch (e) { toast('Load hoy nai: ' + e.message, true); }
}

$('#publish').onclick = async () => {
  const btn = $('#publish'); btn.disabled = true; btn.textContent = 'Publishing...';
  try {
    await putFile('data.json', b64enc(JSON.stringify(data, null, 2) + '\n'), 'Update portfolio data via admin panel');
    dirty = false; $('#dirty').classList.add('hide');
    toast('Published! Site update hote 1-2 minute lagte pare.');
  } catch (e) { toast('Publish fail: ' + e.message, true); }
  btn.disabled = false; btn.textContent = 'Publish to GitHub';
};

/* ---------- UI helpers ---------- */
function field(label, obj, key, type = 'text') {
  const wrap = document.createElement('div');
  const l = document.createElement('label'); l.textContent = label;
  const i = document.createElement(type === 'area' ? 'textarea' : 'input');
  if (type !== 'area') i.type = type;
  i.value = obj[key] ?? '';
  i.oninput = () => { obj[key] = i.value; mark(); };
  wrap.append(l, i); return wrap;
}
function box(title, ...kids) {
  const b = document.createElement('div'); b.className = 'box';
  if (title) { const h = document.createElement('h3'); h.textContent = title; b.append(h); }
  b.append(...kids); return b;
}
function row(...kids) { const r = document.createElement('div'); r.className = 'row'; r.append(...kids); return r; }
function btn(text, cls, fn) { const b = document.createElement('button'); b.className = 'b ' + cls; b.textContent = text; b.onclick = fn; return b; }

/* ---------- panels ---------- */
function renderProfile() {
  const p = data.profile, el = $('#p-profile'); el.textContent = '';
  const avail = document.createElement('label'); avail.style.cssText = 'display:flex;gap:8px;align-items:center;color:var(--ink)';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.style.width = 'auto'; cb.checked = p.available;
  cb.onchange = () => { p.available = cb.checked; mark(); };
  avail.append(cb, 'Show "available" badge');
  const photoUp = photoUploader(p, 'photo');
  el.append(
    box('Basic info', row(field('Full name', p, 'name'), field('Short logo text', p, 'shortName')),
      field('Roles (comma or · separated, typing animation e kaj kore)', p, 'role'),
      row(field('Location', p, 'location'), field('Badge text', p, 'availableText')), avail),
    box('Hero', field('Headline', p, 'heroTitle'), field('Sub text', p, 'heroSub', 'area'),
      field('Photo path', p, 'photo'), photoUp),
    box('About', field('Section title', p, 'aboutTitle'), field('About text', p, 'about', 'area'),
      row(field('Degree', p, 'educationDegree'), field('Education note', p, 'educationNote')))
  );
}

function renderSkills() {
  const el = $('#p-skills'); el.textContent = '';
  data.expertise.forEach((x, i) => {
    el.append(box(null, row(field('Group title', x, 'title'), field('Items (comma separated)', x, 'items')),
      div([btn('Delete', 'red', () => { data.expertise.splice(i, 1); mark(); renderSkills(); })])));
  });
  el.append(div([btn('+ Add skill group', 'b', () => { data.expertise.push({ title: 'New group', items: '' }); mark(); renderSkills(); })]));
  el.append(box('Soft skills', field('Comma separated', data, 'softSkills', 'area')));
}
function div(kids) { const d = document.createElement('div'); d.className = 'tools'; d.append(...kids); return d; }

function photoUploader(obj, key) {
  const wrap = document.createElement('div');
  const img = document.createElement('img'); img.className = 'thumbs'; img.src = previews[obj[key]] || obj[key] || '';
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.style.marginTop = '8px';
  f.onchange = async () => {
    if (!f.files[0]) return;
    try {
      toast('Uploading...');
      const { b64, dataUrl } = await resize(f.files[0], key === 'photo' ? 1000 : 1400);
      const name = 'images/' + Date.now() + '-' + f.files[0].name.replace(/[^\w.-]/g, '_').replace(/\.\w+$/, '.jpg');
      await putFile(name, b64, 'Upload image via admin panel');
      previews[name] = dataUrl; obj[key] = name; img.src = dataUrl; mark(); toast('Image uploaded. Ekhon Publish chap.');
      renderProfile.keep || (key === 'photo' ? renderProfile() : renderProjects());
    } catch (e) { toast('Upload fail: ' + e.message, true); }
  };
  const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'Image upload korle seta GitHub e images/ folder e chole jay (auto resize hoy).';
  wrap.append(img, f, hint); return wrap;
}
function resize(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', .85); res({ dataUrl, b64: dataUrl.split(',')[1] });
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function renderProjects() {
  const el = $('#p-projects'); el.textContent = '';
  data.projects.forEach((p, i) => {
    el.append(box(`Project ${i + 1}: ${p.title || 'Untitled'}`,
      row(field('Title', p, 'title'), field('Category', p, 'category')),
      field('Description', p, 'description', 'area'),
      row(field('Live URL', p, 'url', 'url'), field('Tags (comma separated)', p, 'tags')),
      field('Image path (optional)', p, 'image'), photoUploader(p, 'image'),
      div([
        btn('↑ Up', 'alt', () => move(i, -1)), btn('↓ Down', 'alt', () => move(i, 1)),
        btn('Delete', 'red', () => { if (confirm('Delete this project?')) { data.projects.splice(i, 1); mark(); renderProjects(); } })
      ])));
  });
  el.append(div([btn('+ Add new project', 'b', () => {
    data.projects.push({ title: 'New project', category: '', description: '', url: 'https://', image: '', tags: '' }); mark(); renderProjects();
  })]));
}
function move(i, d) {
  const j = i + d; if (j < 0 || j >= data.projects.length) return;
  [data.projects[i], data.projects[j]] = [data.projects[j], data.projects[i]]; mark(); renderProjects();
}

function renderContact() {
  const c = data.contact, el = $('#p-contact'); el.textContent = '';
  el.append(box('Contact', row(field('Email', c, 'email', 'email'), field('Phone', c, 'phone')),
    row(field('Facebook URL', c, 'facebook'), field('LinkedIn URL', c, 'linkedin')), field('GitHub URL', c, 'github')));
}

function renderSettings() {
  const c = cfg();
  ['owner', 'repo', 'branch', 'token'].forEach(k => $('#g-' + k).value = c[k]);
}
$('#saveSettings').onclick = async () => {
  localStorage.setItem('pf-cfg', JSON.stringify({ owner: $('#g-owner').value.trim(), repo: $('#g-repo').value.trim(), branch: $('#g-branch').value.trim(), token: $('#g-token').value.trim() }));
  toast('Settings saved.');
};
$('#forget').onclick = () => { const c = cfg(); c.token = ''; localStorage.setItem('pf-cfg', JSON.stringify(c)); $('#g-token').value = ''; toast('Token removed.'); };
$('#reload').onclick = async () => { await loadData(); renderAll(); dirty = false; $('#dirty').classList.add('hide'); toast('Reloaded.'); };
$('#download').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'data.json'; a.click();
};
$('#import').onchange = async e => {
  try { data = JSON.parse(await e.target.files[0].text()); renderAll(); mark(); toast('Imported. Publish chap.'); }
  catch { toast('Invalid JSON file', true); }
};

/* ---------- tabs ---------- */
const tabs = [['profile', 'Profile'], ['skills', 'Skills'], ['projects', 'Projects'], ['contact', 'Contact'], ['settings', 'Settings']];
function showTab(id) {
  tabs.forEach(([t]) => { $('#p-' + t).classList.toggle('on', t === id); });
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  location.hash = id;
}
tabs.forEach(([id, label]) => { const b = btn(label, '', () => showTab(id)); b.className = ''; b.dataset.t = id; $('#tabs').append(b); });
function renderAll() { renderProfile(); renderSkills(); renderProjects(); renderContact(); renderSettings(); }
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  await loadData(); if (!data) return;
  renderAll();
  showTab(cfg().token ? (location.hash.slice(1) || 'projects') : 'settings');
  if (!cfg().token) toast('Prothome Settings e GitHub token dao.');
})();
</script>
</body>
</html>
